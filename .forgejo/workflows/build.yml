name: Build and Deploy

# Builds the production image, tags it, and pushes it to the Forgejo registry.
# Deploys to Kubernetes once KUBECONFIG_B64 (see the deploy job) is configured.
on:
  push:
    branches:
      - '*'
      #main
    tags:
      - "v*"
  workflow_dispatch:

env:
  # --- Registry / image -------------------------------------------------------
  PROJECT_NAME: tenantos-backend
  PROJECT_SCHEMA: nodejs
  REGISTRY: ${{vars.REGISTRY_HOST_NAME}}
  IMAGE_NAME: homelab/${{ env.PROJECT_NAME }}
  NODE_VERSION: "20.19-alpine3.20"
  ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
  SKAFFOLDER_REPO: Homelab/skaffolder.git

  # --- Kubernetes --------------------------------------------------------------
  KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
  KUBE_DEPLOYMENT: ${{ vars.KUBE_DEPLOYMENT }}
  KUBE_CONTAINER: ${{ vars.KUBE_CONTAINER }}

  

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-ref: ${{ steps.meta.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          TAGS="${IMAGE}:${SHA_TAG}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF#refs/tags/}"
          fi

          echo "image-tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image-ref=${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    #if: github.ref == 'refs/heads/main'
    steps:

      - name: Checkout skaffolder
        run: |
          set -euo pipefail
          rm -rf skaffolder
          git clone --depth 1 \
            "https://x-access-token:${{ env.ACTIONS_TOKEN }}@${{env.REGISTRY}}/${{ env.SKAFFOLDER_REPO }}" \
            skaffolder

      - name: Install skaffolder
        working-directory: skaffolder
        run: npm run skaffolder-install
      
      - name: Render skaffold manifest
        run: |
          set -euo pipefail
          skaffolder init --name ${{env.PROJECT_NAME}} --env dev --schema ${{env.PROJECT_SCHEMA}}
          ls ./manifests

      - name: Set up kubectl
        run: |
          set -euo pipefail
          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL -o "${RUNNER_TEMP}/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x "${RUNNER_TEMP}/bin/kubectl"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/kubectl" version --client


      - name: Check for kubeconfig
        id: kubeconfig
        run: |
          if [ -n "${{ secrets.KUBECONFIG_B64 }}" ]; then
            echo "found kubeconfig ${{ secrets.KUBECONFIG_B64 }}"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KUBECONFIG_B64 secret not set — skipping Kubernetes deploy."
          fi

      - name: Configure kubeconfig
        if: steps.kubeconfig.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          B64="$(printf '%s' "${{ secrets.KUBECONFIG_B64 }}" | tr -d ' \t\r\n')"
          MOD=$(( ${#B64} % 4 ))
          if [ "$MOD" -ne 0 ]; then
            B64="${B64}$(printf '=%.0s' $(seq 1 $((4 - MOD))))"
          fi
          printf '%s' "$B64" | base64 -d --ignore-garbage > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # No migration step for now — `prisma migrate deploy` is run manually
      # until a migration Job/CronJob is defined in the cluster.
      - name: Roll out new image
        if: steps.kubeconfig.outputs.present == 'true'
        run: |
          set -euo pipefail
          kubectl -n "${KUBE_NAMESPACE}" set image "deployment/${KUBE_DEPLOYMENT}" \
            "${KUBE_CONTAINER}=${{ needs.build-and-push.outputs.image-ref }}"
          kubectl -n "${KUBE_NAMESPACE}" rollout status "deployment/${KUBE_DEPLOYMENT}" --timeout=180s
