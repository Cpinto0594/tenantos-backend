name: Build and Deploy

# Builds the production image, tags it, and pushes it to the Forgejo registry.
# Deploys to Kubernetes once KUBECONFIG_B64 (see the deploy job) is configured.
on:
  push:
    branches:
      - '*'
      #main
    tags:
      - "v*"
  workflow_dispatch:

env:
  # --- Registry / image -------------------------------------------------------
  REGISTRY: forgejo.homelab.capilabs.dev
  IMAGE_NAME: homelab/tenantos-backend
  # Keep in sync with the Dockerfile's ARG NODE_VERSION default.
  NODE_VERSION: "20.19-alpine3.20"

  # --- Kubernetes --------------------------------------------------------------
  KUBE_NAMESPACE: tenantos
  KUBE_DEPLOYMENT: tenantos-backend
  KUBE_CONTAINER: tenantos-backend

jobs:
  build-and-push:
    name: Build and push image
    runs-on: docker
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-ref: ${{ steps.meta.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          TAGS="${IMAGE}:${SHA_TAG}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF#refs/tags/}"
          fi

          echo "image-tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image-ref=${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      # KUBECONFIG_B64 is not set yet — the kubeconfig for the target cluster
      # will be added as a repo/org secret later. Until then this job (and
      # every step below) is skipped rather than failing the pipeline.
      - name: Check for kubeconfig
        id: kubeconfig
        run: |
          if [ -n "${{ secrets.KUBECONFIG_B64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KUBECONFIG_B64 secret not set — skipping Kubernetes deploy."
          fi

      - name: Configure kubeconfig
        if: steps.kubeconfig.outputs.present == '1'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # No migration step for now — `prisma migrate deploy` is run manually
      # until a migration Job/CronJob is defined in the cluster.
      - name: Roll out new image
        if: steps.kubeconfig.outputs.present == 'true'
        run: |
          set -euo pipefail
          kubectl -n "${KUBE_NAMESPACE}" set image "deployment/${KUBE_DEPLOYMENT}" \
            "${KUBE_CONTAINER}=${{ needs.build-and-push.outputs.image-ref }}"
          kubectl -n "${KUBE_NAMESPACE}" rollout status "deployment/${KUBE_DEPLOYMENT}" --timeout=180s
